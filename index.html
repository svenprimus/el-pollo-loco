<!doctype html>
<html lang="en" translate="no">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>El Pollo Loco</title>
        <link rel="icon" type="image/x-icon" href="./assets/icons/favicon.svg" />
        <link rel="stylesheet" href="./styles/fonts.css" />
        <link rel="stylesheet" href="./style.css" />
        <script type="module" src="./script.js" defer></script>
    </head>
    <body>
        <div id="game-wrapper" class="game-wrapper">
            <img class="headline" src="./assets/img/logo-horizontally.png" alt="el-pollo-loco horizontal logo" />
            <canvas id="canvas" width="720" height="480"></canvas>
            <div class="dev-buttons">
                <button id="btn-pause">Pause</button>
                <button id="btn-resume">Resume</button>
                <button id="btn-restart">Restart</button>
                <button id="btn-mute">Mute</button>

                <div>
                    <input type="range" id="volume" name="volume" min="0" max="100" />
                </div>
                <button id="btn-fullscreen">Fullscreen</button>

                <button id="btn-left" class="btn-mobile">Left</button>
                <button id="btn-right" class="btn-mobile">Right</button>
                <button id="btn-jump" class="btn-mobile">Jump</button>
                <button id="btn-attack" class="btn-mobile">Attack</button>
                <button id="btn-drink" class="btn-mobile">Tequila</button>
            </div>
        </div>
    </body>
</html>

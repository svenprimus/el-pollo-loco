<!doctype html>
<html lang="en" translate="no">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>El Pollo Loco</title>
        <link rel="icon" type="image/x-icon" href="./assets/icons/favicon.svg" />
        <link rel="stylesheet" href="./styles/fonts.css" />
        <link rel="stylesheet" href="./styles/variables.css" />
        <link rel="stylesheet" href="./style.css" />
        <script type="module" src="./script.js" defer></script>
    </head>
    <body>
        <img class="headline" src="./assets/img/logo-horizontally.png" alt="el-pollo-loco horizontal logo" />

        <div id="game-wrapper" class="game-wrapper">
            <canvas id="canvas" width="720" height="480"></canvas>

            <div class="button-wrapper-ui">
                <button id="btn-resume" class="btn-ui">
                    <img id="btn-resume-img" src="./assets/icons/start.svg" alt="pause and resume button" />
                </button>
                <button id="btn-restart" class="btn-ui">
                    <img src="./assets/icons/restart.svg" alt="start button" />
                </button>
                <button id="btn-mute" class="btn-ui">
                    <img id="btn-mute-img" src="./assets/icons/mute.svg" alt="toggle mute button" />
                </button>
                <div class="volume-wrapper">
                    <input type="range" id="volume" class="volume" name="volume" min="0" max="100" step="5" />
                </div>
                <button id="btn-instructions" class="btn-ui">
                    <img src="./assets/icons/show.svg" alt="show and hide instructions button" />
                </button>
                <button id="btn-fullscreen" class="btn-ui">
                    <img src="./assets/icons/fullscreen.svg" alt="pause button" />
                </button>
            </div>

            <div class="button-wrapper-mobile">
                <div class="movements">
                    <button id="btn-left" class="btn-left btn-mobile">
                        <img src="./assets/icons/left.svg" alt="arrow left" />
                    </button>
                    <button id="btn-right" class="btn-right btn-mobile">
                        <img src="./assets/icons/right.svg" alt="arrow right" />
                    </button>
                </div>

                <div class="actions">
                    <button id="btn-jump" class="btn-jump btn-mobile">
                        <img src="./assets/icons/jump.svg" alt="jumping man" />
                    </button>
                    <button id="btn-attack" class="btn-attack btn-mobile">
                        <img src="./assets/icons/attack.svg" alt="flying bottle" />
                    </button>
                    <button id="btn-drink" class="btn-drink btn-mobile">
                        <img src="./assets/icons/drink.svg" alt="drinking man" />
                    </button>
                </div>
            </div>
        </div>
    </body>
</html>

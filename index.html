<!doctype html>
<html lang="en" translate="no">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>El Pollo Loco</title>
        <link rel="icon" type="image/x-icon" href="./assets/icons/favicon.svg" />
        <link rel="stylesheet" href="./styles/fonts.css" />
        <link rel="stylesheet" href="./styles/variables.css" />
        <link rel="stylesheet" href="./styles/keyframes.css" />
        <link rel="stylesheet" href="./styles/game-ui.css" />
        <link rel="stylesheet" href="./style.css" />
        <script type="module" src="./script.js" defer></script>
    </head>
    <body>
        <main class="content-limit-1920p">
            <div id="wrapper" class="wrapper">
                <img class="headline" src="./assets/img/logo-horizontally.webp" alt="el-pollo-loco horizontal logo" />
                <article id="game-wrapper" class="game-wrapper">
                    <canvas id="canvas" width="720" height="480"></canvas>
                    <div id="overlay" class="overlay">
                        <aside class="start-menu-settings">
                            <button id="btn-overlay-fullscreen" class="btn-ui">
                                <img
                                    id="btn-overlay-fullscreen-img"
                                    src="./assets/icons/fullscreen.svg"
                                    alt="pause button"
                                />
                            </button>
                            <section class="audio-wrapper">
                                <button id="btn-overlay-mute" class="btn-ui">
                                    <img
                                        id="btn-overlay-mute-img"
                                        src="./assets/icons/mute.svg"
                                        alt="toggle mute button"
                                    />
                                </button>
                                <div class="volume-wrapper">
                                    <input
                                        type="range"
                                        id="overlay-volume"
                                        class="volume"
                                        name="volume"
                                        min="0"
                                        max="100"
                                        step="5"
                                    />
                                </div>
                            </section>
                        </aside>
                        <nav class="start-menu-nav">
                            <button id="btn-overlay-start" class="btn-menu">Start</button>
                            <button id="btn-overlay-instr" class="btn-menu">Controls</button>
                            <button id="btn-overlay-imprt" class="btn-menu">Imprint</button>
                        </nav>
                    </div>
                    <section id="button-wrapper-ui" class="button-wrapper-ui">
                        <section class="audio-wrapper">
                            <div class="volume-wrapper">
                                <input
                                    type="range"
                                    id="volume"
                                    class="volume"
                                    name="volume"
                                    min="0"
                                    max="100"
                                    step="5"
                                />
                            </div>
                            <button id="btn-mute" class="btn-ui">
                                <img id="btn-mute-img" src="./assets/icons/mute.svg" alt="toggle mute button" />
                            </button>
                        </section>
                        <section class="play-wrapper">
                            <button id="btn-resume" class="btn-ui">
                                <img id="btn-resume-img" src="./assets/icons/start.svg" alt="pause and resume button" />
                            </button>
                            <button id="btn-restart" class="btn-ui">
                                <img src="./assets/icons/restart.svg" alt="start button" />
                            </button>
                        </section>
                        <div class="spacemaker"></div>
                        <section class="resize-wrapper">
                            <button
                                id="btn-instructions"
                                class="btn-ui"
                                aria-controls="instructions-dialog"
                                aria-label="open instructions dialog"
                            >
                                <img src="./assets/icons/show.svg" alt="show and hide instructions button" />
                            </button>
                            <button id="btn-return" class="btn-ui">
                                <img id="btn-return-img" src="./assets/icons/return.svg" alt="pause button" />
                            </button>
                            <button id="btn-fullscreen" class="btn-ui">
                                <img id="btn-fullscreen-img" src="./assets/icons/fullscreen.svg" alt="pause button" />
                            </button>
                        </section>
                    </section>

                    <section id="button-wrapper-mobile" class="button-wrapper-mobile">
                        <section class="movements">
                            <button id="btn-left" class="btn-left btn-mobile">
                                <img src="./assets/icons/left.svg" alt="arrow left" />
                            </button>
                            <button id="btn-right" class="btn-right btn-mobile">
                                <img src="./assets/icons/right.svg" alt="arrow right" />
                            </button>
                        </section>
                        <section class="actions">
                            <button id="btn-jump" class="btn-jump btn-mobile">
                                <img src="./assets/icons/jump.svg" alt="jumping man" />
                            </button>
                            <button id="btn-attack" class="btn-attack btn-mobile">
                                <img src="./assets/icons/attack.svg" alt="flying bottle" />
                            </button>
                            <button id="btn-drink" class="btn-drink btn-mobile">
                                <img src="./assets/icons/drink.svg" alt="drinking man" />
                            </button>
                        </section>
                    </section>
                </article>
                <img
                    class="dark-chicken deko-element"
                    src="./assets/img/screen-elements/dark-chicken.gif"
                    alt="shadow of walking chicken"
                />
                <img
                    class="bar-chicken deko-element"
                    src="./assets/img/screen-elements/bar-chicken.webp"
                    alt="rooster in front of a tequila stand"
                />
                <img
                    class="town-chicken deko-element"
                    src="./assets/img/screen-elements/town-chicken.webp"
                    alt="group of female chicken in front of a western town"
                />
                <img
                    class="papel-picado deko-element"
                    src="./assets/img/screen-elements/papel-picado.webp"
                    alt="typical colorfull mexican paper decoration"
                />

                <img class="sombrero deko-element" src="./assets/img/screen-elements/sombrero.webp" alt="mexican hat" />
                <img
                    class="feather delay-1 deko-element"
                    src="./assets/img/screen-elements/feathers/feather-1.svg"
                    alt="turquoise feather"
                />
                <img
                    class="feather delay-2 deko-element"
                    src="./assets/img/screen-elements/feathers/feather-2.svg"
                    alt="green feather"
                />
                <img
                    class="feather delay-3 deko-element"
                    src="./assets/img/screen-elements/feathers/feather-3.svg"
                    alt="orange feather"
                />
                <img
                    class="feather delay-4 deko-element"
                    src="./assets/img/screen-elements/feathers/feather-4.svg"
                    alt="red feather"
                />
                <img
                    class="feather delay-5 deko-element"
                    src="./assets/img/screen-elements/feathers/feather-5.svg"
                    alt="purple feather"
                />
            </div>
        </main>

        <dialog id="instructions-dialog" aria-label="Open Game Instructions">
            <article id="instr-dialog-wrapper" class="dialog-wrapper">
                <header class="dialog-header">
                    <h1>Instructions</h1>
                    <button
                        id="btn-close-dialog"
                        class="btn-close-dialog"
                        aria-controls="instructions-dialog"
                        aria-label="closes instructions dialog"
                    >
                        <img src="./assets/icons/hide.svg" alt="show and hide instructions button" />
                    </button>
                </header>

                <div class="instruction-wrapper">
                    <section class="section-instructions">
                        <img
                            class="dialog-img dialog-desktop"
                            src="./assets/img/instructions-desktop-main.svg"
                            alt="controls for desktop"
                        />
                        <h2 class="dialog-desktop">Controls</h2>

                        <img
                            class="dialog-img dialog-mobile"
                            src="./assets/img/instructions-mobile-1.svg"
                            alt="controls of movements"
                        />
                        <h2 class="dialog-mobile">Movement</h2>
                    </section>
                    <section class="section-instructions">
                        <img
                            class="dialog-img dialog-desktop"
                            src="./assets/img/instructions-desktop-alt.svg"
                            alt="alternative controls"
                        />
                        <h2 class="dialog-desktop">Alternative</h2>

                        <img
                            class="dialog-img dialog-mobile"
                            src="./assets/img/instructions-mobile-2.svg"
                            alt="controls of actions"
                        />
                        <h2 class="dialog-mobile">Actions</h2>
                    </section>
                </div>
            </article>
        </dialog>

        <dialog id="imprint-dialog" aria-label="Open Imprint">
            <article id="imprt-dialog-wrapper" class="dialog-wrapper">
                <header class="dialog-header">
                    <h1>Imprint</h1>
                    <button
                        id="btn-close-imprint"
                        class="btn-close-dialog"
                        aria-controls="imprint-dialog"
                        aria-label="closes imprint dialog"
                    >
                        <img src="./assets/icons/hide.svg" alt="show and hide instructions button" />
                    </button>
                </header>
            </article>
        </dialog>
    </body>
</html>
